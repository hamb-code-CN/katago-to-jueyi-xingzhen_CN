name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 项目是 Windows 专用 (ctypes.windll / PrintWindow / PowerShell 查进程),
    # 且 go_vision 顶层 import ctypes.wintypes, 所以 CI 也跑在 Windows 上。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 测试所需: opencv/numpy (视觉模块) + pyautogui (主循环冒烟测试)。
          # rapidocr(PaddleOCR/onnx) 体积大且测试会跳过, 不装。
          pip install numpy==2.2.6 opencv-python==5.0.0.93 pyautogui==0.9.54

      - name: 语法检查 (全部模块)
        shell: bash
        # 注意: 必须用 bash —— pwsh 不展开通配符, 旧写法 `python -m py_compile go_ai/*.py`
        # 会把字面量 'go_ai/*.py' 当文件名传进去, 直接 errno 22 中断发版。
        run: |
          python -m compileall -q go_ai tools
          echo "语法检查通过"

      - name: 运行回归测试
        run: python -m unittest discover -s go_ai/tests -v

      - name: 打包自检 (不发布)
        run: python tools/make_release.py --version ci-check --out dist-ci

      - name: 上传打包产物 (便于人工核对)
        uses: actions/upload-artifact@v4
        with:
          name: ci-package
          path: dist-ci/*.zip
          retention-days: 7
