name: Release

# 打 tag 即发版: git tag v1.0.3 && git push --tags
# 也可以在 Actions 页面手动触发 (workflow_dispatch), 可填模型下载地址打成完整包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      model_url:
        description: '可选: KataGo 模型 .bin.gz 直链 (填了就打成含模型的完整便携包)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 opencv-python==5.0.0.93 pyautogui==0.9.54

      - name: 发版前先跑回归测试 (测试不过就不发)
        run: python -m unittest discover -s go_ai/tests -v

      - name: 下载模型 (仅手动触发且填了地址时)
        if: ${{ github.event.inputs.model_url != '' }}
        shell: pwsh
        run: |
          curl.exe -L --fail -o katago/model.bin.gz "${{ github.event.inputs.model_url }}"
          Get-Item katago/model.bin.gz | Format-List Name, Length

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "version=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "version=v0.0.0-manual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 打核心包
        shell: pwsh
        run: python tools/make_release.py --version ${{ steps.ver.outputs.version }} --out dist

      - name: 打完整包 (含模型)
        if: ${{ github.event.inputs.model_url != '' }}
        shell: pwsh
        run: python tools/make_release.py --version ${{ steps.ver.outputs.version }} --out dist --with-model

      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $body = @"
          ## GoAI Auto-Player $v

          自动构建产物 (CI 打包, 已通过回归测试)。

          | 文件 | 说明 |
          | --- | --- |
          | ``*-$v.zip`` | 核心包: 代码 + KataGo 引擎, 不含网络权重 |
          | ``*-$v-full.zip`` | 完整便携包: 额外含 ``katago/*.bin.gz`` 权重, 解压即用 |

          各 zip 同目录下的 ``.sha256`` 为校验值, 可用 ``certutil -hashfile <zip> SHA256`` 比对。

          模型获取方式见 README「模型下载与加载」。
          "@
          $body | Out-File -FilePath RELEASE_BODY.md -Encoding utf8
          Get-ChildItem dist | Format-Table Name, Length

      - name: 创建 Release 并上传资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $assets = @(Get-ChildItem dist\*.zip, dist\*.sha256 | ForEach-Object { $_.FullName })
          gh release view $v 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $v @assets --clobber
          } else {
            gh release create $v @assets --title "GoAI Auto-Player $v" --notes-file RELEASE_BODY.md
          }
